<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>즐거운 명절 보내세요</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1411; }
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  img {
    display: block;
    width: min(100%, calc((100vh - 32px) * 1.5));
    height: auto;
    border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
  }
</style>
</head>
<body>
  <img src="chuseok-robot.svg" alt="한복 입은 로봇이 부침개를 집어 먹는 추석 인사 애니메이션 — 즐거운 명절 보내세요">
</body>
</html>
